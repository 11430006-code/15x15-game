<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>15×15 生存挑戰</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

    background: #101522;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.game-container {
    width: 100%;
    max-width: 650px;
    text-align: center;
}

/* 標題 */

h1 {
    margin: 0 0 5px;
    font-size: 32px;
}

.subtitle {
    color: #9da7bb;
    margin-bottom: 20px;
}

/* 分數區 */

.info {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 15px;
}

.info-box {
    background: #1b2333;
    border: 1px solid #303b50;

    border-radius: 12px;

    padding: 10px 25px;

    min-width: 120px;
}

.info-title {
    font-size: 12px;
    color: #9da7bb;
}

.info-value {
    font-size: 22px;
    font-weight: bold;

    margin-top: 3px;
}

/* 遊戲區 */

.game-panel {
    position: relative;

    background: #171e2d;

    border: 1px solid #303b50;

    border-radius: 18px;

    padding: 15px;
}

/* 地圖 */

#board {

    width: min(90vw, 560px);

    aspect-ratio: 1 / 1;

    margin: auto;

    display: grid;

    grid-template-columns: repeat(15, 1fr);

    background: #0e1420;

    border: 3px solid #53627d;

    border-radius: 8px;

    overflow: hidden;
}

/* 格子 */

.cell {

    display: flex;

    justify-content: center;

    align-items: center;

    border-right: 1px solid #252e40;

    border-bottom: 1px solid #252e40;

    font-size: clamp(12px, 3vw, 25px);

    user-select: none;
}

/* 玩家 */

.player {

    background: #263f62;

}

/* 石頭 */

.rock {

    background: #202938;

}

/* 怪物 */

.monster {

    background: #39252d;

}

/* 狀態 */

#status {

    margin-top: 12px;

    color: #b8c2d4;

    font-size: 14px;

}

/* 圖例 */

.legend {

    margin-top: 10px;

    color: #9da7bb;

    font-size: 13px;

    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;
}

/* 控制按鈕 */

.controls {

    margin: 18px auto 5px;

    display: grid;

    grid-template-columns: repeat(3, 55px);

    gap: 7px;

    justify-content: center;
}

button {

    min-width: 50px;

    min-height: 50px;

    border-radius: 12px;

    border: 1px solid #3b4962;

    background: #222c3e;

    color: white;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    background: #30415c;

}

button:active {

    transform: scale(0.95);

}

/* 功能按鈕 */

.actions {

    margin-top: 12px;

    display: flex;

    justify-content: center;

    gap: 10px;

}

.action-button {

    padding: 0 20px;

    font-size: 14px;

}

.primary {

    background: #315d91;

}

/* 遊戲結束畫面 */

.overlay {

    position: absolute;

    top: 15px;

    left: 15px;

    right: 15px;

    bottom: 15px;

    background: rgba(10, 14, 23, 0.94);

    border-radius: 12px;

    display: none;

    justify-content: center;

    align-items: center;

    z-index: 10;
}

.overlay.show {

    display: flex;

}

.game-over-title {

    font-size: 34px;

    font-weight: bold;

    margin-bottom: 10px;
}

.final-score {

    font-size: 20px;

    margin-bottom: 20px;

}

/* 手機 */

@media (max-width: 500px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 25px;
    }

    .info-box {
        padding: 8px 15px;
        min-width: 100px;
    }

    .game-panel {
        padding: 9px;
    }

    .overlay {
        top: 9px;
        left: 9px;
        right: 9px;
        bottom: 9px;
    }

}

</style>
</head>


<body>

<div class="game-container">

    <h1>15×15 生存挑戰</h1>

    <div class="subtitle">
        避開石頭與怪物，盡可能走得更遠！
    </div>


    <!-- 分數 -->

    <div class="info">

        <div class="info-box">

            <div class="info-title">
                SCORE
            </div>

            <div
                id="score"
                class="info-value">
                20902
            </div>

        </div>


        <div class="info-box">

            <div class="info-title">
                STEPS
            </div>

            <div
                id="steps"
                class="info-value">
                0
            </div>

        </div>

    </div>


    <!-- 遊戲 -->

    <div class="game-panel">

        <div
            id="board">
        </div>


        <div
            id="status">

            方向鍵 / WASD 移動

        </div>


        <div class="legend">

            <span>🙂 玩家</span>

            <span>🪨 石頭 ×3</span>

            <span>👾 怪物 ×3</span>

        </div>


        <!-- 手機方向鍵 -->

        <div class="controls">

            <span></span>

            <button
                type="button"
                data-direction="up">

                ↑

            </button>

            <span></span>


            <button
                type="button"
                data-direction="left">

                ←

            </button>


            <button
                type="button"
                data-direction="down">

                ↓

            </button>


            <button
                type="button"
                data-direction="right">

                →

            </button>

        </div>


        <!-- 功能 -->

        <div class="actions">

            <button
                id="pauseButton"
                class="action-button">

                暫停

            </button>


            <button
                id="restartButton"
                class="action-button primary">

                重新開始

            </button>

        </div>


        <!-- 死亡畫面 -->

        <div
            id="gameOver"
            class="overlay">

            <div>

                <div class="game-over-title">

                    遊戲結束

                </div>


                <div
                    id="deathReason"
                    style="margin-bottom:8px;color:#c4ccda;">

                </div>


                <div
                    id="finalScore"
                    class="final-score">

                    最終分數：20902

                </div>


                <button
                    id="playAgainButton"
                    class="primary"
                    style="padding:0 25px;font-size:16px;">

                    再玩一次

                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================
   遊戲設定
========================= */

const SIZE = 15;

const START_SCORE = 20902;

const ROCK_COUNT = 3;

const MONSTER_COUNT = 3;


/* =========================
   遊戲變數
========================= */

let player;

let rocks = [];

let monsters = [];

let score;

let steps;

let alive;

let paused;

let monsterTimer;


/* =========================
   HTML 元件
========================= */

const board =
    document.getElementById("board");

const scoreDisplay =
    document.getElementById("score");

const stepsDisplay =
    document.getElementById("steps");

const statusDisplay =
    document.getElementById("status");

const pauseButton =
    document.getElementById("pauseButton");

const restartButton =
    document.getElementById("restartButton");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const deathReason =
    document.getElementById("deathReason");

const playAgainButton =
    document.getElementById("playAgainButton");


/* =========================
   座標轉成文字
========================= */

function positionKey(row, col) {

    return row + "," + col;

}


/* =========================
   隨機產生空位置
========================= */

function getRandomFreePosition(used) {

    let row;
    let col;

    do {

        row =
            Math.floor(
                Math.random() * SIZE
            );

        col =
            Math.floor(
                Math.random() * SIZE
            );

    }

    while (
        used.has(
            positionKey(row, col)
        )
    );


    used.add(
        positionKey(row, col)
    );


    return {
        row: row,
        col: col
    };

}


/* =========================
   開始遊戲
========================= */

function startGame() {

    clearInterval(monsterTimer);


    score = START_SCORE;

    steps = 0;

    alive = true;

    paused = false;


    /*
       玩家一開始在中央
       第 8 列、第 8 欄
    */

    player = {
        row: 7,
        col: 7
    };


    rocks = [];

    monsters = [];


    /*
       確保石頭與怪物
       不會一開始就出現在玩家身上
    */

    const used = new Set();

    used.add(
        positionKey(
            player.row,
            player.col
        )
    );


    /*
       產生 3 顆石頭
    */

    for (
        let i = 0;
        i < ROCK_COUNT;
        i++
    ) {

        rocks.push(
            getRandomFreePosition(used)
        );

    }


    /*
       產生 3 隻怪物
    */

    for (
        let i = 0;
        i < MONSTER_COUNT;
        i++
    ) {

        monsters.push(
            getRandomFreePosition(used)
        );

    }


    scoreDisplay.textContent = score;

    stepsDisplay.textContent = steps;

    statusDisplay.textContent =
        "方向鍵 / WASD 移動";


    pauseButton.textContent =
        "暫停";


    gameOver.classList.remove("show");


    render();


    /*
       怪物每 650 毫秒移動一次
    */

    monsterTimer =
        setInterval(
            moveMonsters,
            650
        );

}


/* =========================
   畫出地圖
========================= */

function render() {

    board.innerHTML = "";


    for (
        let row = 0;
        row < SIZE;
        row++
    ) {

        for (
            let col = 0;
            col < SIZE;
            col++
        ) {

            const cell =
                document.createElement("div");


            cell.classList.add("cell");


            /*
               玩家
            */

            if (
                player.row === row &&
                player.col === col
            ) {

                cell.classList.add(
                    "player"
                );

                cell.textContent = "🙂";

            }


            /*
               怪物
            */

            else if (
                monsters.some(
                    monster =>
                        monster.row === row &&
                        monster.col === col
                )
            ) {

                cell.classList.add(
                    "monster"
                );

                cell.textContent = "👾";

            }


            /*
               石頭
            */

            else if (
                rocks.some(
                    rock =>
                        rock.row === row &&
                        rock.col === col
                )
            ) {

                cell.classList.add(
                    "rock"
                );

                cell.textContent = "🪨";

            }


            board.appendChild(cell);

        }

    }

}


/* =========================
   玩家移動
========================= */

function movePlayer(rowChange, colChange) {

    if (!alive || paused) {
        return;
    }


    const newRow =
        player.row + rowChange;

    const newCol =
        player.col + colChange;


    /*
       撞到邊界
    */

    if (
        newRow < 0 ||
        newRow >= SIZE ||
        newCol < 0 ||
        newCol >= SIZE
    ) {

        gameEnd(
            "💥 你撞到邊界了！"
        );

        return;

    }


    /*
       撞到石頭
    */

    const hitRock =
        rocks.some(
            rock =>
                rock.row === newRow &&
                rock.col === newCol
        );


    if (hitRock) {

        gameEnd(
            "🪨 你撞到石頭了！"
        );

        return;

    }


    /*
       撞到怪物
    */

    const hitMonster =
        monsters.some(
            monster =>
                monster.row === newRow &&
                monster.col === newCol
        );


    if (hitMonster) {

        gameEnd(
            "👾 你撞到怪物了！"
        );

        return;

    }


    /*
       成功移動
    */

    player.row = newRow;

    player.col = newCol;


    /*
       每走一步 +1
    */

    score++;

    steps++;


    scoreDisplay.textContent =
        score;

    stepsDisplay.textContent =
        steps;


    render();

}


/* =========================
   怪物移動
========================= */

function moveMonsters() {

    if (!alive || paused) {
        return;
    }


    const directions = [

        { row: 1, col: 0 },

        { row: -1, col: 0 },

        { row: 0, col: 1 },

        { row: 0, col: -1 }

    ];


    monsters =
        monsters.map(
            (monster, monsterIndex) => {


                /*
                   隨機排列方向
                */

                const shuffled =
                    [...directions]
                    .sort(
                        () =>
                            Math.random() - 0.5
                    );


                for (
                    const direction
                    of shuffled
                ) {

                    const newRow =
                        monster.row +
                        direction.row;

                    const newCol =
                        monster.col +
                        direction.col;


                    /*
                       不可以跑出地圖
                    */

                    if (
                        newRow < 0 ||
                        newRow >= SIZE ||
                        newCol < 0 ||
                        newCol >= SIZE
                    ) {

                        continue;

                    }


                    /*
                       不可以撞石頭
                    */

                    if (
                        rocks.some(
                            rock =>
                                rock.row === newRow &&
                                rock.col === newCol
                        )
                    ) {

                        continue;

                    }


                    /*
                       不可以撞其他怪物
                    */

                    if (
                        monsters.some(
                            (other, index) =>
                                index !== monsterIndex &&
                                other.row === newRow &&
                                other.col === newCol
                        )
                    ) {

                        continue;

                    }


                    /*
                       怪物碰到玩家
                    */

                    if (
                        player.row === newRow &&
                        player.col === newCol
                    ) {

                        gameEnd(
                            "👾 你被怪物抓到了！"
                        );

                        return monster;

                    }


                    return {

                        row: newRow,

                        col: newCol

                    };

                }


                /*
                   如果沒有合法位置
                   怪物就原地不動
                */

                return monster;

            }
        );


    if (alive) {

        /*
           再檢查一次
           防止怪物與玩家重疊
        */

        const monsterHit =
            monsters.some(
                monster =>
                    monster.row === player.row &&
                    monster.col === player.col
            );


        if (monsterHit) {

            gameEnd(
                "👾 你被怪物抓到了！"
            );

            return;

        }


        render();

    }

}


/* =========================
   遊戲結束
========================= */

function gameEnd(reason) {

    alive = false;

    clearInterval(
        monsterTimer
    );


    statusDisplay.textContent =
        reason;


    deathReason.textContent =
        reason;


    finalScore.textContent =
        "最終分數：" + score;


    gameOver.classList.add(
        "show"
    );


    render();

}


/* =========================
   鍵盤控制
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key = event.key;


        if (
            key === "ArrowUp" ||
            key === "ArrowDown" ||
            key === "ArrowLeft" ||
            key === "ArrowRight" ||
            key === "w" ||
            key === "W" ||
            key === "a" ||
            key === "A" ||
            key === "s" ||
            key === "S" ||
            key === "d" ||
            key === "D"
        ) {

            event.preventDefault();

        }


        switch (key) {

            case "ArrowUp":

            case "w":

            case "W":

                movePlayer(
                    -1,
                    0
                );

                break;


            case "ArrowDown":

            case "s":

            case "S":

                movePlayer(
                    1,
                    0
                );

                break;


            case "ArrowLeft":

            case "a":

            case "A":

                movePlayer(
                    0,
                    -1
                );

                break;


            case "ArrowRight":

            case "d":

            case "D":

                movePlayer(
                    0,
                    1
                );

                break;

        }

    }
);


/* =========================
   手機方向鍵
========================= */

document
    .querySelectorAll(
        "[data-direction]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    const direction =
                        button.dataset.direction;


                    if (
                        direction === "up"
                    ) {

                        movePlayer(
                            -1,
                            0
                        );

                    }

                    else if (
                        direction === "down"
                    ) {

                        movePlayer(
                            1,
                            0
                        );

                    }

                    else if (
                        direction === "left"
                    ) {

                        movePlayer(
                            0,
                            -1
                        );

                    }

                    else if (
                        direction === "right"
                    ) {

                        movePlayer(
                            0,
                            1
                        );

                    }

                }
            );

        }
    );


/* =========================
   暫停
========================= */

pauseButton.addEventListener(
    "click",
    function() {

        if (!alive) {
            return;
        }


        paused = !paused;


        if (paused) {

            pauseButton.textContent =
                "繼續";

            statusDisplay.textContent =
                "⏸️ 遊戲暫停";

        }

        else {

            pauseButton.textContent =
                "暫停";

            statusDisplay.textContent =
                "方向鍵 / WASD 移動";

        }

    }
);


/* =========================
   重新開始
========================= */

restartButton.addEventListener(
    "click",
    startGame
);


playAgainButton.addEventListener(
    "click",
    startGame
);


/* =========================
   第一次啟動遊戲
========================= */

startGame();

</script>

</body>
</html>
